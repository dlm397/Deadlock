# data_dir is relative to this config folder. Dataset output_dir and
# supplemental_dir are relative to data_dir and must stay inside it.
[paths]
data_dir = "../data"
supplemental_dir = "supplemental"

# Retained local Source 2 replays -> one full_match.duckdb. No replay downloads.
[full_match]
output_dir = "full_match"
match_ids = []
match_ids_file = ""
sampling_interval_s = 20
replay_dir = "full_match/replays" # relative to data_dir; CLI paths are relative to cwd
batch_size = 1 # maximum attempted matches per invocation, including failures
retry_failures = false
rebuild_outputs = false
api_base = "https://api.deadlock-api.com"
disable_steam = true

# Public Parquet data lake; no Source 2 replay or API metadata collection.
[end_match]
output_dir = "end_match"
manifest_url = "https://data.deadlock-api.com/v1/manifest.json"
match_ids = []
match_ids_file = ""
# Maximum NEW complete matches added per invocation (existing matches refresh).
match_limit = 4000
# Explicit per-invocation download bounds; no scan of the entire lake.
max_download_mib = 2048
max_files = 5
retain_shards = true
export_csv = false
retry_failures = false
rebuild_outputs = false
